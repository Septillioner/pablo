# Canonical self-deploy manifest (Schema v2).
# Install the CLI binary locally or over SSH.
#
#   pablo run -p default -e macos-local
#   pablo run -p default -e windows-local
#   pablo run -p default -e linux-local
#   pablo run -p default -e linux-remote
#
name: pablo
version: 2.0.1

credentials:
  server-ssh:
    type: ssh
    username: root
    key: ~/.ssh/id_rsa

profiles:
  default:
    type: binary
    build:
      path: ./src
    environments:
      macos-local:
        build:
          command: "go build -o ../build/pablo ."
        deploy:
          source:
            dir: ./build
            include: ["pablo"]
            exclude: ["*.tmp"]
          target_path: /opt/pablo
          strategy: overwrite
        register_path:
          scope: user

      windows-local:
        build:
          command: "go build -o ../build/pablo.exe ."
        deploy:
          source:
            dir: ./build
            include: ["pablo.exe"]
            exclude: ["*.tmp"]
          target_path: "C:\\Program Files\\Pablo"
          strategy: overwrite
        register_path:
          scope: system

      linux-local:
        build:
          command: "GOOS=linux GOARCH=amd64 go build -o ../build/pablo ."
        deploy:
          source:
            dir: ./build
            include: ["pablo"]
            exclude: ["*.tmp"]
          target_path: /opt/pablo
          strategy: overwrite
        register_path:
          scope: system

      linux-remote:
        build:
          command: "GOOS=linux GOARCH=amd64 go build -o ../build/pablo ."
        remote:
          host: lysep.com
          credential: server-ssh
        deploy:
          source:
            dir: ./build
            include: ["pablo"]
            exclude: ["*.tmp"]
          target_path: /opt/pablo
          strategy: overwrite
          transfer: tar
          verify_checksum: true
        register_path:
          scope: system
