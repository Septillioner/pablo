name: pablo-e2e-ssh-rename-replace
version: 0.0.1

credentials:
  e2e-ssh:
    type: ssh
    username: deploy
    key: ../../keys/id_ed25519

profiles:
  default:
    type: static
    output_dir:
      dir: ./src
      include: ["*.html"]
    environments:
      e2e:
        remote:
          method: ssh
          host: 127.0.0.1:2222
          credential: e2e-ssh
        deploy:
          target_path: /tmp/pablo-e2e-rename-replace
          strategy: rename-replace
