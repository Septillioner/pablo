name: release-web
version: 1.0.0

credentials:
  e2e-ssh:
    type: ssh
    username: deploy
    key: ../../keys/id_ed25519

sequences:
  release:
    - web/staging
    - web/production

profiles:
  web:
    type: static
    environments:
      staging:
        remote:
          host: 127.0.0.1:2222
          credential: e2e-ssh
          host_key_verification: off
        deploy:
          source:
            dir: ./src
            include: ["**/*"]
            exclude: ["*.map"]
          target_path: /var/www/app-staging
          strategy: overwrite
      production:
        remote:
          host: 127.0.0.1:2222
          credential: e2e-ssh
          host_key_verification: off
        deploy:
          source:
            dir: ./src
            include: ["**/*"]
            exclude: ["*.map"]
          target_path: /var/www/app
          strategy: overwrite
