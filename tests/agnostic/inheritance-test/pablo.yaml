name: inheritance-app
version: 1.0.0

profiles:
  default:
    type: binary
    build:
      command: "echo 'Building shared...'"
      path: ./src
    environments:
      local:
        deploy:
          source:
            dir: ./build
            include: ["*"]
          target_path: /tmp/local-dep
          strategy: overwrite
      remote:
        deploy:
          source:
            dir: ./build
            include: ["*"]
          target_path: /tmp/remote-dep
