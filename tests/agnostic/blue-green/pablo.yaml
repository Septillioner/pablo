name: blue-green-local
version: 0.0.1

profiles:
  site:
    type: static
    environments:
      local:
        deploy:
          source:
            dir: ./src
            include: ["**/*"]
          target_path: ./live
          strategy: recreate
          blue_green:
            slots:
              - path: ./slots/blue
              - path: ./slots/green
            detect_command: if (Test-Path './live.active') { (Get-Content './live.active' -Raw).Trim() }
            switch_command: Set-Content -Path './live.active' -Value $env:PABLO_TARGET_SLOT -NoNewline
          post_commands:
            - command: Set-Content -Path './cwd-project.marker' -Value 'from-project' -NoNewline
              cwd: project

  # key decouples detect stdout from the write path (mapped-drive / IIS style).
  site-keyed:
    type: static
    environments:
      local:
        deploy:
          source:
            dir: ./src
            include: ["**/*"]
          target_path: ./live-keyed
          strategy: recreate
          blue_green:
            slots:
              - path: ./slots-keyed/blue
                key: slot-blue
                switch_command: Set-Content -Path './live-keyed.active' -Value 'slot-blue' -NoNewline
              - path: ./slots-keyed/green
                key: slot-green
                switch_command: Set-Content -Path './live-keyed.active' -Value 'slot-green' -NoNewline
            detect_command: if (Test-Path './live-keyed.active') { (Get-Content './live-keyed.active' -Raw).Trim() }
