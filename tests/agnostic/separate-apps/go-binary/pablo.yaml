name: go-microservice
version: 3.2.1

credentials:
  prod_server:
    type: ssh
    username: deploy
    key: ~/.ssh/id_rsa

profiles:
  default:
    type: binary
    environments:
      development:
        build:
          command: go build -ldflags="-s -w" -o myservice ./cmd/server
          path: ./
        deploy:
          source:
            dir: ./
            include: ["myservice"]
          target_path: /usr/local/bin
          strategy: backup
          post_commands:
            - systemctl restart myservice-dev
        register_path:
          scope: user
      production:
        build:
          command: go build -ldflags="-s -w" -o myservice ./cmd/server
          path: ./
        remote:
          host: 192.168.1.102
          credential: prod_server
        deploy:
          source:
            dir: ./
            include: ["myservice"]
          target_path: /usr/local/bin
          strategy: backup
          post_commands:
            - systemctl restart myservice
        register_path:
          scope: system
