name: go-microservice-local
version: 3.2.1

profiles:
  default:
    type: binary
    environments:
      development:
        build:
          command: go build -ldflags="-s -w" -o myservice ./cmd/server
          path: ./
        deploy:
          source:
            dir: ./
            include: ["myservice"]
          target_path: ./dist/dev
          strategy: backup
        register_path:
          scope: user
      production:
        build:
          command: go build -ldflags="-s -w" -o myservice ./cmd/server
          path: ./
        deploy:
          source:
            dir: ./
            include: ["myservice"]
          target_path: ./dist/prod
          strategy: backup
        register_path:
          scope: system
