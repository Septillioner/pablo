name: multi-profile-deployment
version: 1.0.0

credentials:
  prod_server:
    type: ssh
    username: deploy
    key: ~/.ssh/id_rsa
  staging_server:
    type: ssh
    username: deploy
    password: staging_pass
  github_token:
    type: token
    value: ghp_example_token_12345
  docker_registry:
    type: basic
    username: dockeruser
    password: dockerpass

profiles:
  frontend:
    type: static
    environments:
      development:
        build:
          command: npm run build
          path: ./
          variables:
            API_URL: http://localhost:3000
            ENV: development
            DEBUG: "true"
        remote:
          host: 192.168.1.100
          credential: staging_server
        deploy:
          source:
            dir: ./dist
            include: ["**/*"]
            exclude: ["*.map", "*.log", "*.DS_Store"]
          target_path: /var/www/dev-frontend
          strategy: overwrite
      production:
        build:
          command: npm run build
          path: ./
          variables:
            API_URL: https://api.example.com
            ENV: production
            DEBUG: "false"
        remote:
          host: 192.168.1.100
          credential: prod_server
        deploy:
          source:
            dir: ./dist
            include: ["**/*"]
            exclude: ["*.map", "*.log", "*.DS_Store"]
          target_path: /var/www/html
          strategy: backup

  backend-api:
    type: docker
    git:
      repo: https://github.com/company/backend-api.git
      branch: main
      credential: github_token
    environments:
      staging:
        variables:
          DB_HOST: staging-db.internal
          DB_USER: staging_user
          DB_PASS: staging_pass
          REDIS_HOST: staging-redis
        remote:
          host: 192.168.1.101
          credential: staging_server
        deploy:
          target_path: /opt/backend-staging
          docker:
            compose_file: docker-compose.yml
            build: true
            stop_before_sync: true
      production:
        variables:
          DB_HOST: prod-db.internal
          DB_USER: prod_user
          DB_PASS: prod_secure_pass
          REDIS_HOST: prod-redis
        remote:
          host: 192.168.1.101
          credential: prod_server
        deploy:
          target_path: /opt/backend-prod
          docker:
            compose_file: docker-compose.prod.yml
            build: true
            stop_before_sync: true

  go-service:
    type: binary
    environments:
      development:
        build:
          command: go build -o myservice ./cmd/server
          path: ./
        remote:
          host: 192.168.1.102
          credential: staging_server
        deploy:
          source:
            dir: ./
            include: ["myservice"]
          target_path: /usr/local/bin
          strategy: backup
          post_commands:
            - systemctl restart myservice-dev
        register_path:
          scope: user
      production:
        build:
          command: go build -o myservice ./cmd/server
          path: ./
        remote:
          host: 192.168.1.102
          credential: prod_server
        deploy:
          source:
            dir: ./
            include: ["myservice"]
          target_path: /usr/local/bin
          strategy: backup
          post_commands:
            - systemctl restart myservice
        register_path:
          scope: system

  php-webapp:
    type: git-sync
    git:
      repo: git@github.com:company/php-webapp.git
      branch: master
    environments:
      staging:
        variables:
          APP_ENV: staging
          APP_DEBUG: "true"
          DB_HOST: staging-mysql
        remote:
          host: 192.168.1.103
          credential: staging_server
        deploy:
          target_path: /var/www/php-staging
          post_commands:
            - composer install --no-dev
            - php artisan migrate --force
            - php artisan cache:clear
      production:
        variables:
          APP_ENV: production
          APP_DEBUG: "false"
          DB_HOST: prod-mysql
        remote:
          host: 192.168.1.103
          credential: prod_server
        deploy:
          target_path: /var/www/php-prod
          post_commands:
            - composer install --no-dev --optimize-autoloader
            - php artisan migrate --force
            - php artisan config:cache
            - php artisan route:cache
